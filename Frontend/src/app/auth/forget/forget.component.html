<section class="container pb-4">
  <div class="row justify-content-sm-center">
    <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9 my-5">
      <div class="card row border rounded-5 bg-white shadow box-area">
        <div class="card-body p-5">
          <h1 class="fs-4 card-title fw-bold mb-4">User Forgot Password </h1>

          <form [formGroup]="userPasswordForgetForm" (submit)="submitUserPasswordForgetForm()" autocomplete="off">
            <div class="mb-3">
              <label class="form-label mb-2 text-muted" for="userEmail">User Email <span
                  class="text-danger fs-5">*</span></label>
              <input id="userEmail" type="text" class="form-control mb-2" name="userEmail" formControlName="userEmail"
                placeholder="Enter your email" />


              <span class="text-danger" *ngIf="userPasswordForgetForm.get('userEmail')?.touched
                 && userPasswordForgetForm.get('userEmail')?.hasError('required')
                  ">* Field is required</span>

              <span class="text-danger" *ngIf="
                        userPasswordForgetForm.get('userEmail')?.hasError('email') && 
                        userPasswordForgetForm.get('userEmail')?.touched
                      ">* Must have a valid email</span>


            </div>

            <div class="d-flex align-items-center">
              <button type="submit" [disabled]="!userPasswordForgetForm.valid" class="btn btn-primary ms-auto"
                style="width: 100%">
                Send OTP to mail
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
