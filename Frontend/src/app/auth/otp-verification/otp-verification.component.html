<section class="container pb-4">
  <div class="row justify-content-sm-center">
    <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9 my-5">
      <div class="card row border rounded bg-white shadow box-area">
        <div class="card-body p-5">
          <h1 class="fs-4 card-title fw-bold mb-4">User OTP Verification </h1>

            <div class="mb-3">
              <label class="form-label mb-2 text-muted" for="userOTP">Enter your OTP <span
                  class="text-danger fs-5">*</span></label>


              <ng-otp-input (onInputChange)="onOtpChange($event)"
                [config]="{ length: 6, inputStyles: { 'width': '50px', 'height': '50px' } , allowNumbersOnly: true }">
              </ng-otp-input>

            </div>

            <div class="d-flex align-items-center">
              <button type="submit" [disabled]="!isOtpValid()" (click)="submitUserPasswordForgetOtpForm()"
                class="btn btn-primary ms-auto" style="width: 100%">
                Verify OTP
              </button>
            </div>
        </div>
      </div>
    </div>
  </div>
</section>
